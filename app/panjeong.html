<script>
/* ===================== 고정 값 ===================== */
const CONDS = [
  {id:"A-v1", set:"A", guide:"v1", label:"1차 · 세트 A · 가이드 v1"},
  {id:"B-v2", set:"B", guide:"v2", label:"2차 · 세트 B · 가이드 v2"},
  {id:"A-v2", set:"A", guide:"v2", label:"재판정 · 세트 A · 가이드 v2"},
];
const TYPES = [
  {k:"body", name:"신체 형태", hint:"손가락 수, 팔다리 개수, 눈·코·입이 뭉개짐"},
  {k:"motion", name:"신체 움직임", hint:"갑자기 자리 이동, 관절이 뒤로 꺾임, 몸이 물체 통과"},
  {k:"object", name:"사물·배경", hint:"사람 외 대상이 갑자기 생기거나 사라지거나 바뀜"},
  {k:"quality", name:"화질", hint:"화면 전체가 흐림, 노이즈, 깨짐"},
];
const LABELS = ["R1","R2","R3","R4","R5","R6"];
const DEFAULT_V1 = `판정하는 법
1. 영상을 필요한 만큼 보세요. 본 횟수를 '재생 횟수'에 적습니다.
2. 사람이나 사물이 현실에서는 일어날 수 없는 모양이나 움직임을 보이면 '왜곡 있음'입니다.
3. 왜곡이 있으면 네 가지 유형 중 해당하는 것을 모두 고릅니다.
   - 신체 형태: 몸의 모양이 이상함 (손가락 수, 팔다리 개수, 눈·코·입이 뭉개짐 등)
   - 신체 움직임: 모양은 멀쩡하나 움직임이 불가능함 (갑자기 자리 이동, 관절이 뒤로 꺾임, 몸이 물체를 통과)
   - 사물·배경: 사람 외 대상이 갑자기 생기거나 사라지거나 모양이 바뀜
   - 화질: 화면 전체가 흐리거나 노이즈·깨짐이 있음
4. 가장 눈에 띄는 왜곡을 기준으로 심각도를 고릅니다. 찾아야 보이면 경미, 눈에 바로 띄면 심각.
5. 고민되거나 애매했다면 이유를 '메모'에 한 줄 적습니다. 다른 판정자와 상의하지 마세요.
'판단 불가'는 영상이 재생되지 않거나 사람이 등장하지 않을 때만 고릅니다.`;

/* ===================== 상태 ===================== */
const S = {
  db:null, user:null, sample:null, assets:null, downloads:null,
  uid:null, isOwner:false, canWrite:true,
  config:{active:"A-v1", guides:{v1:DEFAULT_V1, v2:""}},
  videos:[], myLabel:null, myJ:{}, tab:null,
  rater:{cond:null, idx:0, draft:null},
  analysis:{c1:"A-v1", c2:"", result:null},
};
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ===================== 계산 (파이썬 03_agreement.py와 같은 방식) ===================== */
function fleiss(rows){ // rows: array of arrays (같은 길이), 값=범주
  if (!rows.length) return NaN;
  const n = rows[0].length; if (n < 2) return NaN;
  const cats = [...new Set(rows.flat())];
  const tot = {}; cats.forEach(c=>tot[c]=0);
  let pbar = 0;
  for (const r of rows){
    const cnt = {}; r.forEach(v=>{cnt[v]=(cnt[v]||0)+1; tot[v]++;});
    let s=0; for (const c in cnt) s += cnt[c]*cnt[c];
    pbar += (s - n)/(n*(n-1));
  }
  pbar /= rows.length;
  const N = rows.length*n; let pe = 0; for (const c of cats) pe += (tot[c]/N)**2;
  if (Math.abs(1-pe) < 1e-12) return NaN;
  return (pbar - pe)/(1 - pe);
}
function cohen(a, b){
  const n=a.length; if(!n) return NaN;
  const cats=[...new Set([...a,...b])]; let po=0; a.forEach((v,i)=>{ if(v===b[i]) po++; }); po/=n;
  let pe=0; for(const c of cats){ pe += (a.filter(x=>x===c).length/n)*(b.filter(x=>x===c).length/n); }
  if (Math.abs(1-pe)<1e-12) return NaN; return (po-pe)/(1-pe);
}
function rng(seed){ let s = seed>>>0 || 1; return ()=>{ s ^= s<<13; s>>>=0; s ^= s>>>17; s ^= s<<5; s>>>=0; return s/4294967296; }; }
function hashStr(str){ let h=2166136261; for (const ch of str){ h ^= ch.codePointAt(0); h = Math.imul(h,16777619); } return h>>>0; }
function pct(arr,p){ const s=[...arr].sort((x,y)=>x-y); const i=(s.length-1)*p; const lo=Math.floor(i), hi=Math.ceil(i); return s[lo]+(s[hi]-s[lo])*(i-lo); }
function bootCI(rows, R=2000, seed=2026){
  const r = rng(seed), v=[];
  for (let b=0;b<R;b++){ const s=[]; for(let i=0;i<rows.length;i++) s.push(rows[Math.floor(r()*rows.length)]); const k=fleiss(s); if(!isNaN(k)) v.push(k); }
  return v.length ? [pct(v,.025), pct(v,.975)] : [NaN,NaN];
}
function bootDiff(r1, r2, paired, keys1, keys2, R=2000, seed=2027){
  const r = rng(seed), v=[];
  if (paired){
    const m2 = new Map(keys2.map((k,i)=>[k,r2[i]]));
    const pairs = keys1.map((k,i)=>[r1[i], m2.get(k)]).filter(p=>p[1]);
    for (let b=0;b<R;b++){ const a=[],c=[]; for(let i=0;i<pairs.length;i++){ const p=pairs[Math.floor(r()*pairs.length)]; a.push(p[0]); c.push(p[1]); } const d=fleiss(c)-fleiss(a); if(!isNaN(d)) v.push(d); }
  } else {
    for (let b=0;b<R;b++){ const a=[],c=[]; for(let i=0;i<r1.length;i++) a.push(r1[Math.floor(r()*r1.length)]); for(let i=0;i<r2.length;i++) c.push(r2[Math.floor(r()*r2.length)]); const d=fleiss(c)-fleiss(a); if(!isNaN(d)) v.push(d); }
  }
  return v.length ? [pct(v,.025), pct(v,.975)] : [NaN,NaN];
}
function spearman(x, y){
  const rank = a => { const idx=a.map((v,i)=>[v,i]).sort((p,q)=>p[0]-q[0]); const r=new Array(a.length); let i=0; while(i<idx.length){ let j=i; while(j+1<idx.length && idx[j+1][0]===idx[i][0]) j++; const avg=(i+j)/2+1; for(let k=i;k<=j;k++) r[idx[k][1]]=avg; i=j+1; } return r; };
  const rx=rank(x), ry=rank(y), n=x.length, mx=rx.reduce((s,v)=>s+v,0)/n, my=ry.reduce((s,v)=>s+v,0)/n;
  let sxy=0,sx=0,sy=0; for(let i=0;i<n;i++){ sxy+=(rx[i]-mx)*(ry[i]-my); sx+=(rx[i]-mx)**2; sy+=(ry[i]-my)**2; }
  return sxy/Math.sqrt(sx*sy);
}
function interpret(k){ if(isNaN(k)) return "계산 불가"; if(k<=0) return "일치 안 됨"; if(k<=.2) return "약간"; if(k<=.4) return "어느 정도"; if(k<=.6) return "보통"; if(k<=.8) return "상당히"; return "거의 완전"; }
const f3 = x => isNaN(x) ? "–" : x.toFixed(3);

/* 판정 묶음 → 항목별 표. judg: {label: {vid: j}} */
function buildTables(judg){
  const labels = Object.keys(judg).filter(l=>Object.keys(judg[l]).length).sort();
  const vids = [...new Set(labels.flatMap(l=>Object.keys(judg[l])))].sort();
  const items = {"왜곡 유무":[], "심각도 (없음·경미·심각)":[]}; TYPES.forEach(t=>items["유형: "+t.name]=[]);
  const keys = {}; Object.keys(items).forEach(k=>keys[k]=[]);
  for (const v of vids){
    const js = labels.map(l=>judg[l][v]);
    if (js.some(j=>!j || (j.presence!=="없음" && j.presence!=="있음"))) continue;
    const pres = js.map(j=>j.presence);
    items["왜곡 유무"].push(pres); keys["왜곡 유무"].push(v);
    const sev = js.map(j=> j.presence==="없음" ? "없음" : (j.severity||""));
    if (sev.every(s=>s)){ items["심각도 (없음·경미·심각)"].push(sev); keys["심각도 (없음·경미·심각)"].push(v); }
    for (const t of TYPES){ items["유형: "+t.name].push(js.map(j=> j.presence==="있음" && (j.types||[]).includes(t.k) ? 1 : 0)); keys["유형: "+t.name].push(v); }
  }
  return {labels, vids, items, keys};
}

/* ===================== 저장소 ===================== */
const jPath = uid => `ratings/${uid}/j`;
async function loadAllHuman(cond){ // {label:{vid:j}}
  const out = {};
  const raters = await S.db.collection("ratings").get();
  for (const d of raters.docs){
    const label = (d.data()||{}).label || ("판정자-"+d.id.slice(-4));
    const q = await S.db.collection(`ratings/${d.id}/j`).where("cond","==",cond).get();
    q.docs.forEach(x=>{ const j=x.data(); (out[label] ||= {})[j.vid]=j; });
  }
  const imp = await S.db.collection("secret").get();
  imp.docs.forEach(d=>{
    if (!d.id.startsWith("imported_"+cond+"_")) return;
    const lab = d.id.split("_").pop(); const rows = (d.data()||{}).rows||{};
    for (const [vid,j] of Object.entries(rows)) (out[lab] ||= {})[vid] = j;
  });
  return out;
}
async function getSecret(name){ const s = await S.db.doc("secret/"+name).get(); return s.exists ? s.data() : null; }
async function setSecret(name, data){ await S.db.doc("secret/"+name).set(data); }

/* ===================== 시작 ===================== */
(async function boot(){
  try { S.user = await claude.use("user"); } catch { S.user = null; }
  try { S.db = await claude.use("db"); } catch { S.db = null; }
  if (!S.db){ renderNoDb(); return; }
  S.uid = S.user ? await S.user.id() : null;
  S.isOwner = S.user ? await S.user.isOwner() : false;
  claude.use("sample").then(x=>{ S.sample=x; if(S.tab && S.tab!=="rate") render(true); }).catch(()=>{});
  if (S.isOwner){
    claude.use("assets").then(x=>S.assets=x).catch(()=>{});
    claude.use("downloads").then(x=>S.downloads=x).catch(()=>{});
  }
  S.db.doc("study/config").onSnapshot(s=>{ if(s.exists){ const d=s.data(); S.config={active:d.active||"A-v1", guides:{v1:d.guides?.v1||DEFAULT_V1, v2:d.guides?.v2||""}}; } render(true); }, ()=>{});
  S.db.collection("videos").onSnapshot(q=>{ S.videos=q.docs.map(d=>d.data()).filter(v=>v&&v.vid); render(true); }, ()=>{});
  if (S.uid && !S.isOwner){
    S.db.doc("ratings/"+S.uid).onSnapshot(s=>{ S.myLabel = s.exists ? s.data().label : null; render(true); }, ()=>{});
    S.db.collection(jPath(S.uid)).onSnapshot(q=>{ S.myJ={}; q.docs.forEach(d=>{ const j=d.data(); S.myJ[j.cond+"_"+j.vid]=j; }); render(true); }, ()=>{});
  }
  S.tab = S.isOwner ? "progress" : "rate";
  renderWho(); render();
})();

function renderNoDb(){
  $("#who").replaceChildren(el("span",{class:"chip warn"},"저장소 없음"));

async function condBlock(cond, T, vq){
  if (T.labels.length<2) return el("p",{class:"note warn"},`${cond}: 판정자가 2명 이상 있어야 계산할 수 있어요 (지금 ${T.labels.length}명).`);
  const tb = el("table",{}, el("tr",{}, ...["항목","영상 수","카파","95% 구간","해석"].map(h=>el("th",{},h))));
  for (const [name, rows] of Object.entries(T.items)){
    const k=fleiss(rows), [lo,hi]=bootCI(rows);
    tb.append(el("tr",{}, el("td",{},name), el("td",{class:"num"},rows.length), el("td",{class:"num"},f3(k)), el("td",{class:"num"},`${f3(lo)} ~ ${f3(hi)}`), el("td",{},interpret(k))));
  }
  // AI 판정자
  const ai = (await getSecret("ai_"+cond))?.rows || {};
  let aiBlock = null;
  const aiVids = Object.keys(ai);
  if (aiVids.length){
    const humans = await loadAllHuman(cond);
    const a=[], m=[]; const withAI=[];
    for (const v of T.keys["왜곡 유무"]){
      if (!ai[v] || !["없음","있음"].includes(ai[v].presence)) continue;
      const hs = T.labels.map(l=>humans[l][v].presence); const yes = hs.filter(x=>x==="있음").length;
      if (yes*2 === hs.length) continue; // 동점 제외
      a.push(ai[v].presence); m.push(yes*2>hs.length?"있음":"없음"); withAI.push([...hs, ai[v].presence]);
    }
    const agree = a.filter((x,i)=>x===m[i]).length;
    aiBlock = el("p",{class:"note"}, `AI 판정자: 영상 ${a.length}개에서 사람 다수결과 ${a.length?Math.round(agree/a.length*100):0}% 일치 · Cohen 카파 ${f3(cohen(a,m))} · AI를 5번째 판정자로 넣은 Fleiss 카파 ${f3(fleiss(withAI))} (사람만: ${f3(fleiss(T.items["왜곡 유무"]))})`);
  }
  // RQ3
  let rq3 = el("p",{class:"muted small"},"화질 점수(vq)가 없어서 RQ3을 건너뜁니다. [설정]에서 영상 CSV를 올리면 함께 저장돼요.");
  const vs = T.keys["왜곡 유무"].filter(v=>vq[v]!=null);
  if (vs.length>=5){
    const humans = await loadAllHuman(cond);
    const share = vs.map(v=>T.labels.filter(l=>humans[l][v]?.presence==="있음").length/T.labels.length);
    rq3 = el("p",{class:"small"}, `RQ3 · 화질 점수와 '왜곡 있음' 비율의 스피어만 상관 rho = ${f3(spearman(vs.map(v=>vq[v]), share))} (영상 ${vs.length}개). 음수면 화질이 낮을수록 왜곡 판정이 많다는 뜻.`);
  }
  const dis = await disagreementsFor(cond);
  return el("div",{style:"display:flex;flex-direction:column;gap:8px"},
    el("h3",{},`${CONDS.find(c=>c.id===cond).label} · 판정자 ${T.labels.join(", ")}`),
    el("div",{class:"tablewrap"},tb), aiBlock, rq3,
    el("details",{}, el("summary",{},`갈린 영상 ${dis.length}개와 메모 보기`), disTable(dis)));
}
async function disagreementsFor(cond){
  const H = await loadAllHuman(cond); const T = buildTables(H); const out=[];
  for (const v of T.vids){
    const js = T.labels.map(l=>H[l][v]); if (js.some(j=>!j)) continue;
    const pres = js.map(j=>j.presence), sev = js.map(j=>j.presence==="있음"?j.severity:"없음");
    const typ = js.map(j=>(j.types||[]).slice().sort().join("+")||"-");
    let why = "";
    if (new Set(pres).size>1) why = "유무 갈림";
    else if (new Set(sev).size>1) why = "심각도 갈림";
    else if (pres[0]==="있음" && new Set(typ).size>1) why = "유형 갈림";
    if (!why) continue;
    const link = S.videos.find(x=>x.vid===v)?.link || "";
    out.push({vid:v, why, votes:T.labels.map((l,i)=>`${l}:${pres[i]}${pres[i]==="있음"?`/${sev[i]}/${typ[i]}`:""}`).join("  "), memos:T.labels.map((l,i)=>js[i].memo?`${l}: ${js[i].memo}`:"").filter(Boolean).join(" | "), link});
  }
  return out;
}

function panelAIRater(){
  const p = el("div",{class:"panel"},

    el("div",{class:"row"}, el("label",{class:"field"},"조건", condSelect("aircond",AI.cond,v=>{AI.cond=v; render();}))));
  const box = el("div",{}, el("p",{class:"muted"},"불러오는 중…")); p.append(box);
  fillAIRater(box); return p;

async function fillAIRater(box){
  const set = CONDS.find(c=>c.id===AI.cond).set;
  const vids = S.videos.filter(v=>v.set===set).sort((a,b)=>a.vid.localeCompare(b.vid));
  if (!vids.length){ box.replaceChildren(el("p",{class:"muted"},"영상이 없어요. [설정]에서 먼저 올려 주세요.")); return; }
  const frames = (await getSecret("frames_"+set))?.map || {};
  const ai = (await getSecret("ai_"+AI.cond))?.rows || {};
  const ready = vids.filter(v=>(frames[v.vid]||[]).length && !ai[v.vid]);
  const status = el("p",{class:"small"}, AI.frameMsg || `장면 사진 있는 영상 ${vids.filter(v=>(frames[v.vid]||[]).length).length}/${vids.length}개 · AI 판정 완료 ${Object.keys(ai).length}개`);
  const tb = el("table",{}, el("tr",{}, ...["영상","장면 사진","올리기","AI 판정"].map(h=>el("th",{},h))));
  for (const v of vids.slice(0,240)){
    const fr = frames[v.vid]||[];
    const imgIn = el("input",{type:"file",accept:"image/png,image/jpeg,image/webp",multiple:true,id:"img-"+v.vid,style:"max-width:170px",onchange:e=>uploadFrames(set,v.vid,[...e.target.files],box)});
    const vidIn = el("input",{type:"file",accept:"video/mp4,video/webm",id:"vid-"+v.vid,style:"max-width:170px",onchange:e=>extractFrames(set,v.vid,e.target.files[0],box)});
    const a = ai[v.vid];
    tb.append(el("tr",{}, el("td",{class:"num"}, el("a",{href:v.link,target:"_blank",rel:"noopener"},v.vid)),
      el("td",{}, fr.length? el("div",{class:"frames"}, ...fr.slice(0,4).map(id=>el("img",{src:"/_blob/"+id,alt:v.vid+" 장면"}))) : el("span",{class:"muted small"},"없음")),
      el("td",{}, el("div",{style:"display:flex;flex-direction:column;gap:4px"}, el("span",{class:"small muted"},"사진"), imgIn, el("span",{class:"small muted"},"또는 영상 파일"), vidIn)),
      el("td",{class:"small"}, a? el("span",{class: a.presence==="있음"?"chip warn":"chip ok"}, a.presence+(a.severity?"/"+a.severity:"")) : "–")));
  }
  box.replaceChildren(status,
    el("div",{class:"row"}, el("button",{class:"btn primary",disabled:!S.sample||AI.busy||!ready.length,onclick:()=>runAIJudge(set,ready,frames,box)},`다음 묶음 AI 판정 (대기 ${ready.length}개)`), el("button",{class:"btn",disabled:!AI.busy,onclick:()=>AI.ctl?.abort()},"멈추기")),
    el("div",{class:"tablewrap"},tb));
}
async function uploadFrames(set, vid, files, box){
  if (!S.assets) return toast("이 화면에서는 파일을 올릴 수 없어요 (연구자 권한 필요)");
  try{
    const ids=[]; for (const f of files.slice(0,4)){ const r = await S.assets.upload(f); ids.push(r.id); }
    const cur = (await getSecret("frames_"+set)) || {map:{}}; cur.map[vid] = [...(cur.map[vid]||[]), ...ids].slice(-4);
    await setSecret("frames_"+set, cur); AI.frameMsg = `${vid}: 사진 ${ids.length}장 올렸어요`; fillAIRater(box);
  }catch(e){ toast("올리지 못했어요: "+(e.code||"")); }
}
async function extractFrames(set, vid, file, box){
  if (!file) return;
  AI.frameMsg = `${vid}: 영상에서 장면 4개를 뽑는 중…`; fillAIRater(box);
  try{
    const url = URL.createObjectURL(file); const v = document.createElement("video"); v.muted=true; v.src=url; v.preload="auto";
    await new Promise((res,rej)=>{ v.onloadedmetadata=res; v.onerror=()=>rej(new Error("영상을 열 수 없어요")); setTimeout(()=>rej(new Error("시간 초과")),15000); });
    const blobs=[]; const c=document.createElement("canvas"); const scale=Math.min(1,960/v.videoWidth); c.width=Math.round(v.videoWidth*scale); c.height=Math.round(v.videoHeight*scale);
    for (const t of [.15,.4,.65,.9]){
      await new Promise((res,rej)=>{ v.onseeked=res; v.onerror=rej; v.currentTime=Math.max(0,v.duration*t); setTimeout(res,4000); });
      c.getContext("2d").drawImage(v,0,0,c.width,c.height);
      blobs.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.85)));
    }
    URL.revokeObjectURL(url);
    await uploadFrames(set, vid, blobs.filter(Boolean).map((b,i)=>new File([b],`${vid}_${i}.jpg`,{type:"image/jpeg"})), box);
  }catch(e){ AI.frameMsg = `${vid}: 영상에서 장면을 뽑지 못했어요 (${e.message}). 장면 사진을 직접 올려 주세요.`; fillAIRater(box); }
}
async function runAIJudge(set, ready, frames, box){
  let lim; try{ lim = await S.sample.limits(); }catch{ lim=null; }
  if (!lim?.images) return toast("이 화면에서는 Claude에게 이미지를 보낼 수 없어요");
  const per = 4; const batch = []; let count = 0;
  for (const v of ready){ const n = Math.min(per,(frames[v.vid]||[]).length); if (count+n > lim.images.maxCount || batch.length>=6) break; batch.push(v); count+=n; }
  if (!batch.length) return;
  AI.busy=true; AI.ctl=new AbortController(); AI.frameMsg=`AI가 영상 ${batch.length}개를 판정하는 중…`; fillAIRater(box);
  try{
    const imgs=[]; const legend=[];
    for (const v of batch){ const ids=(frames[v.vid]||[]).slice(0,per); legend.push(`${v.vid}: 사진 ${imgs.length+1}~${imgs.length+ids.length}번`); for (const id of ids){ const r=await fetch("/_blob/"+id); imgs.push(await r.blob()); } }
    const prompt = `당신은 AI 생성 영상의 왜곡을 판정하는 판정자입니다. 사람 판정자와 똑같은 아래 가이드를 따르세요.

[가이드]
${guideOf(AI.cond)}

첨부 사진은 영상별 장면 캡처입니다(시간 순). 사진 번호 배정:
${legend.join("\n")}
장면 사이의 움직임은 직접 볼 수 없으니, 장면들 사이의 변화로만 판단하세요.

JSON 배열만 답하세요. 영상마다 하나씩:
[{"vid":"A001","presence":"없음|있음|판단 불가","types":["body","motion","object","quality"],"severity":"경미|심각|","reason":"한 문장"}]
types는 presence가 "있음"일 때만, 해당하는 것만 넣으세요(body=신체 형태, motion=신체 움직임, object=사물·배경, quality=화질).`;
    const arr = await S.sample.json(prompt,{images:imgs,signal:AI.ctl.signal,modelTier:"default"});
    const cur = (await getSecret("ai_"+AI.cond)) || {rows:{}};
    let n=0; for (const r of (Array.isArray(arr)?arr:[])){ if (!batch.find(b=>b.vid===r.vid)) continue; cur.rows[r.vid] = {presence:r.presence, types:(r.types||[]).filter(t=>TYPES.some(x=>x.k===t)), severity:r.presence==="있음"?(r.severity||""):"", memo:r.reason||"", at:new Date().toISOString()}; n++; }
    await setSecret("ai_"+AI.cond, cur); AI.frameMsg = `AI 판정 ${n}개를 저장했어요.`;
  }catch(e){ AI.frameMsg = sampleErr(e); }
  AI.busy=false; fillAIRater(box);
}

[절차] 판정자 4명(성인, 비전문가 포함 가능). 1주 준비 → 2주 파일럿 10개 → 3주 세트 A를 v1로 판정 → 4주 갈린 사례를 유형화해 v2 작성(AI 두 개의 의견을 참고하되 연구자가 결정) → 5~6주 세트 B를 v2로 판정, 2주 뒤 세트 A를 v2로 재판정 → 7~8주 분석.
[판정 항목] 왜곡 유무(없음/있음/판단 불가), 유형 다중선택(신체 형태/신체 움직임/사물·배경/화질), 심각도(경미/심각), 재생 횟수, 메모.
[분석] 항목별 Fleiss 카파, 영상 단위 부트스트랩 2,000회 95% 구간. 주 비교: 세트 A(v1) 대 세트 B(v2), 보강 비교: 세트 A의 v1 대 v2(같은 영상). RQ3은 스피어만 상관. 보조로 AI(Claude)를 장면 캡처로 5번째 판정자로 넣어 사람 다수결과의 일치도를 보고.
[연구자] 생성 영상 판정 QC 실무 9개월 경력의 독립 연구자.

특히 다음을 봐 주세요: 학습 효과·순서 효과, 세트 간 난이도 차이, 판정자 수와 표본 크기의 충분성, v2를 만든 사람이 연구자라는 점의 편향, AI 판정자 비교의 타당성, 윤리(동의·사례비).`;
}

async function saveConfig(patch){
  const next = {active:S.config.active, guides:{...S.config.guides}, ...patch};
  if (patch.guides) next.guides = {...S.config.guides, ...patch.guides};
  try{ await S.db.doc("study/config").set(next); }catch{ toast("저장하지 못했어요"); }
}
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  text = text.replace(/^﻿/,"");
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if (q){ if (ch==='"'){ if (text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if (ch==='"') q=true; else if (ch===','){ row.push(cur); cur=""; } else if (ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; } else if (ch!=='\r') cur+=ch; }
  if (cur||row.length){ row.push(cur); rows.push(row); }
  const head = rows.shift()||[]; return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h.trim(),r[i]])));
}
async function importVideos(files, msg){
  try{
    let n=0; const vq={...((await getSecret("vq"))?.map||{})};
    for (const f of files){
      const rows = parseCSV(await f.text());
      for (const r of rows){
        const vid=(r.video_id||"").trim(); if (!/^[AB]\d{3}$/.test(vid)) continue;
        await S.db.doc("videos/"+vid).set({vid, set:vid[0], link:(r.video_link||"").trim()});
        if (r.visual_quality) vq[vid]=Number(r.visual_quality); n++;
        if (n%20===0) msg.textContent=`${n}개 올리는 중…`;
      }
    }
    await setSecret("vq",{map:vq}); msg.textContent=`영상 ${n}개를 올렸어요.`;
  }catch(e){ msg.textContent="올리지 못했어요: "+(e.message||e.code||""); }
}
async function importSheets(files, msg){
  if (typeof XLSX==="undefined"){ msg.textContent="엑셀 읽기 도구를 불러오지 못했어요."; return; }
  const typeKey = {"신체 형태":"body","신체 움직임":"motion","사물·배경":"object","화질":"quality"};
  const done=[];
  for (const f of files){
    const m = f.name.match(/sheet_([AB])_(v[12])_(R\d+)/i);
    if (!m){ done.push(`${f.name}: 이름에서 조건을 못 읽음`); continue; }
    const cond = `${m[1].toUpperCase()}-${m[2].toLowerCase()}`, lab=m[3].toUpperCase();
    if (!CONDS.some(c=>c.id===cond)){ done.push(`${f.name}: 알 수 없는 조건`); continue; }
    const wb = XLSX.read(await f.arrayBuffer(),{type:"array"}); const ws = wb.Sheets["판정"] || wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws,{defval:""}); const out={};
    for (const r of rows){
      const vid=String(r["video_id"]||"").trim(); const pres=String(r["왜곡 유무"]||"").trim(); if (!vid||!pres) continue;
      const types = Object.entries(typeKey).filter(([k])=>String(r[k]).trim().toUpperCase()==="O").map(([,v])=>v);
      out[vid] = {cond, vid, presence:pres, types: pres==="있음"?types:[], severity: pres==="있음"?String(r["심각도"]||"").trim():"", plays:Number(r["재생 횟수"])||null, memo:String(r["메모"]||"").trim()};
    }
    try{ await setSecret(`imported_${cond}_${lab}`, {rows:out, file:f.name, at:new Date().toISOString()}); done.push(`${f.name}: ${Object.keys(out).length}개`); }
    catch{ done.push(`${f.name}: 저장 실패`); }
  }
  msg.textContent = done.join(" · ");
}
async function exportAll(){
  try{
    const lines=[["cond","rater","video_id","presence","types","severity","plays","memo"].join(",")];
    const esc = s => `"${String(s??"").replace(/"/g,'""')}"`;
    for (const c of CONDS){ const H = await loadAllHuman(c.id); for (const [lab,m] of Object.entries(H)) for (const j of Object.values(m)) lines.push([c.id,lab,j.vid,j.presence,(j.types||[]).join("+"),j.severity,j.plays??"",j.memo].map(esc).join(","));
      const ai=(await getSecret("ai_"+c.id))?.rows||{}; for (const [vid,j] of Object.entries(ai)) lines.push([c.id,"AI",vid,j.presence,(j.types||[]).join("+"),j.severity,"",j.memo].map(esc).join(",")); }
    await S.downloads.save({filename:"판정결과_전체.csv", data:new Blob(["﻿"+lines.join("\n")],{type:"text/csv"})});
  }catch(e){ if (e&&e.code!=="cancelled") toast("저장하지 못했어요"); }
}
